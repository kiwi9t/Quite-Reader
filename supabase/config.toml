# Supabase CLI config for Quiet Reader. Only the settings this project needs;
# the CLI fills in defaults for everything else.
# Quiet Reader 的 Supabase CLI 配置，只写本项目需要的项，其余由 CLI 使用默认值。

project_id = "quiet-reader"

[functions.quiet-reader]
# The frontend calls the API without a Supabase login, like the old Railway
# backend. Rate limiting and input limits still apply inside the function.
# 前端不登录 Supabase 直接调用 API（与原 Railway 后端一致），函数内部仍有限流和输入限制。
verify_jwt = false
entrypoint = "./functions/quiet-reader/index.ts"
